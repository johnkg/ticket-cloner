<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Copy a Jira issue from one Atlassian site to another, with a preview of every field before anything is written."
    />

    <!-- Matches the paper and the ink, so the browser chrome does not sit at a
         different temperature from the page. -->
    <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <title>Ticket Cloner</title>

    <!--
      Fraunces for headings: a soft, warm serif rather than an industrial
      grotesk, set in sentence case at comfortable sizes. Plus Jakarta Sans
      carries the interface, JetBrains Mono the keys and JSON.

      Corporate networks block font CDNs often enough that the stacks in
      index.css fall back to a system serif, a system sans and a system mono
      on purpose.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before the first paint, or a saved dark theme would show a
      // white page for as long as the bundle takes to load.
      try {
        var saved = localStorage.getItem('ticketcloner.theme')
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved)
        }
      } catch (e) {
        // Storage unavailable - fall through to prefers-color-scheme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
